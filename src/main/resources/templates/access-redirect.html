<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Abrindo plataforma</title>
</head>
<body>
<script th:inline="javascript">
    const url = /*[[\${url}]]*/ '';

    if ( window.opener && !window.opener.closed )
    {
        window.opener.location.reload();
    }

    window.location.replace( url );
</script>

<p>
    Abrindo plataforma...
    <a th:href="@{\${url}}">Clique aqui se a página não abrir.</a>
</p>
</body>
</html>
