<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${modoEdicao} ? 'Editar plataforma' : 'Nova plataforma')}"></head><body>
<div th:replace="~{fragments/navbar :: navbar}"></div><main class="container py-4"><div class="row justify-content-center"><div class="col-lg-8">
<div class="mb-4"><h1 class="h3" th:text="${modoEdicao} ? 'Editar plataforma' : 'Nova plataforma'"></h1><p class="text-secondary mb-0">Informe os dados do link que deseja acompanhar.</p></div>
<div class="card border-0 shadow-sm"><div class="card-body p-4"><form th:action="${modoEdicao} ? @{/editar/{id}(id=${cdPlatform})} : @{/salvar}" th:object="${platformRequest}" method="post">
<div class="mb-3"><label class="form-label fw-semibold" for="nmPlatform">Nome da plataforma</label><input id="nmPlatform" class="form-control" th:field="*{nmPlatform}" maxlength="100" required><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('nmPlatform')}" th:errors="*{nmPlatform}"></div></div>
<div class="mb-3"><label class="form-label fw-semibold" for="dsPlatform">Descrição</label><textarea id="dsPlatform" class="form-control" rows="3" th:field="*{dsPlatform}" maxlength="500"></textarea><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('dsPlatform')}" th:errors="*{dsPlatform}"></div></div>
<div class="mb-4"><label class="form-label fw-semibold" for="dsUrl">URL</label><input id="dsUrl" type="url" class="form-control" th:field="*{dsUrl}" maxlength="1000" placeholder="https://..." required><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('dsUrl')}" th:errors="*{dsUrl}"></div></div>
<div class="d-flex justify-content-end gap-2"><a class="btn btn-outline-secondary" th:href="@{/}">Cancelar</a><button class="btn btn-success" type="submit"><i class="bi bi-check-lg me-1"></i><span th:text="${modoEdicao} ? 'Atualizar' : 'Salvar'"></span></button></div>
</form></div></div></div></div></main><script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}"></script></body></html>
