<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Plataformas')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">Plataformas</h1>
            <p class="text-secondary mb-0">Links organizados pela data do último acesso.</p>
        </div>

        <div class="d-flex align-items-center gap-3">
            <span class="badge text-bg-success" th:text="${#lists.size(plataformas)} + ' ativas'"></span>
            <a class="btn btn-outline-success" th:href="@{/importar}">Importar CSV</a>
            <a class="btn btn-success" th:href="@{/novo}">Nova plataforma</a>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(plataformas)}" class="empty-state p-5 text-center">
                <i class="bi bi-link-45deg display-5 text-secondary"></i>
                <h2 class="h5 mt-3">Nenhuma plataforma cadastrada</h2>
                <p class="text-secondary">Cadastre sua primeira plataforma para começar.</p>
                <a class="btn btn-success" th:href="@{/novo}">Cadastrar plataforma</a>
            </div>

            <div th:unless="${#lists.isEmpty(plataformas)}" class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Plataforma</th>
                        <th>Descrição</th>
                        <th>Último acesso</th>
                        <th class="text-end">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="plataforma : ${plataformas}">
                        <td>
                            <div class="fw-semibold" th:text="${plataforma.nmPlatform}"></div>
                            <small class="text-secondary text-break" th:text="${plataforma.dsUrl}"></small>
                        </td>

                        <td class="text-secondary">
                            <span th:if="${plataforma.dsPlatform == null}">-</span>
                            <span th:unless="${plataforma.dsPlatform == null}"
                                  th:text="${#strings.length(plataforma.dsPlatform) > 50 ? #strings.substring(plataforma.dsPlatform, 0, 50) + '...' : plataforma.dsPlatform}">
                            </span>
                        </td>

                        <td>
                            <span class="badge bg-dark"
                                  th:if="${plataforma.stAcesso == 'NUNCA'}">
                                Nunca acessou
                            </span>

                            <span class="badge bg-success"
                                  th:if="${plataforma.stAcesso == 'HOJE'}"
                                  th:text="${#temporals.format(plataforma.dtUltimoAcesso, 'dd/MM/yyyy HH:mm')}">
                            </span>

                            <span class="badge bg-warning text-dark"
                                  th:if="${plataforma.stAcesso == 'SEMANA'}"
                                  th:text="${#temporals.format(plataforma.dtUltimoAcesso, 'dd/MM/yyyy HH:mm')}">
                            </span>

                            <span class="badge bg-danger"
                                  th:if="${plataforma.stAcesso == 'ANTIGO'}"
                                  th:text="${#temporals.format(plataforma.dtUltimoAcesso, 'dd/MM/yyyy HH:mm')}">
                            </span>
                        </td>

                        <td>
                            <div class="d-flex justify-content-end flex-wrap gap-2">
                                <form th:action="@{/acessar/{id}(id=${plataforma.cdPlatform})}"
                                      method="post"
                                      target="_blank">
                                    <button type="submit" class="btn btn-success btn-sm">
                                        Acessar
                                    </button>
                                </form>

                                <a class="btn btn-outline-secondary btn-sm"
                                   th:href="@{/visualizar/{id}(id=${plataforma.cdPlatform})}">
                                    Visualizar
                                </a>

                                <a class="btn btn-outline-primary btn-sm"
                                   th:href="@{/editar/{id}(id=${plataforma.cdPlatform})}">
                                    Editar
                                </a>

                                <form th:action="@{/toggle/{id}(id=${plataforma.cdPlatform})}" method="post">
                                    <button class="btn btn-outline-secondary btn-sm" type="submit">
                                        Desativar
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:if="${!#lists.isEmpty(inativas)}" class="mt-4">
        <h2 class="h5 mb-3">Plataformas desativadas</h2>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0 table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <tbody>
                    <tr th:each="plataforma : ${inativas}">
                        <td class="ps-4">
                            <span class="fw-semibold" th:text="${plataforma.nmPlatform}"></span>
                        </td>

                        <td class="text-secondary" th:text="${plataforma.dsUrl}"></td>

                        <td class="text-end pe-4">
                            <div class="d-flex justify-content-end gap-2">
                                <form th:action="@{/toggle/{id}(id=${plataforma.cdPlatform})}" method="post">
                                    <button class="btn btn-outline-success btn-sm" type="submit">
                                        Ativar
                                    </button>
                                </form>

                                <form th:action="@{/deletar/{id}(id=${plataforma.cdPlatform})}"
                                      method="post"
                                      onsubmit="return confirm('Deseja realmente deletar esta plataforma?');">
                                    <button class="btn btn-outline-danger btn-sm" type="submit">
                                        Deletar
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
